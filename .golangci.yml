version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # ─── Bugs & Correctness ───
    - errcheck          # unchecked errors
    - govet             # suspicious constructs
    - staticcheck       # SA* diagnostics (bugs, perf, style)
    - ineffassign        # dead assignments
    - unused            # unused declarations
    - nilerr            # return nil despite checking err != nil
    - nilnil            # return (nil, nil) on failure
    - nilnesserr        # checks err != nil but returns wrong nil
    - wastedassign      # assignments overwritten before use
    - copyloopvar       # loop variable copies (Go <1.22 compat)
    - durationcheck     # duration * duration (always 0)
    - makezero          # append to non-zero-length slice

    # ─── Security ───
    - gosec             # SQL injection, hardcoded creds, weak crypto

    # ─── Code Quality & Smells ───
    - revive            # golint replacement, configurable rules
    - gocritic          # 100+ checks: bugs, perf, style
    - gocyclo           # cyclomatic complexity
    - gocognit          # cognitive complexity (harder metric)
    - funlen            # function length
    - nestif            # nesting depth
    - unconvert         # unnecessary type conversions
    - unparam           # unused function parameters
    - prealloc          # slice preallocation hints
    - misspell          # typos in comments
    - dupl              # code clone detection
    - goconst           # repeated strings → constants
    - nakedret          # naked returns in long functions
    - exhaustive        # switch exhaustiveness for enums
    - errname           # Err prefix for sentinels, Error suffix for types
    - errorlint         # proper error wrapping (errors.Is/As)
    - maintidx          # maintainability index

    # ─── Zero-allocation enforcement ───
    - bodyclose         # HTTP response body closed (important for pooled conns)
    - intrange          # for i := 0; i < n → for i := range n
    - mirror            # wrong bytes/strings mirror (avoids copies)

    # ─── Interface hygiene (SOLID) ───
    - interfacebloat    # too many methods in interface (ISP violation)
    - iface             # incorrect interface usage detection

  settings:
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
    funlen:
      lines: 80
      statements: 60
    nestif:
      # nestif's only valid setting is min-complexity (the earlier `min-depth`
      # key was silently ignored → ran at the default 5; we keep that here).
      min-complexity: 5
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 4
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      disabled-checks:
        - hugeParam        # server streams are pointers by design
        - rangeValCopy     # false positives on small structs
        - exitAfterDefer   # test files use t.Fatal after defer
    gosec:
      excludes:
        - G115             # int32/int64 overflow — flow control values always < 2^31
        - G402             # TLS config — we manage TLS ourselves
        - G404             # weak random — non-crypto use
    govet:
      enable-all: true
      disable:
        - fieldalignment   # structs ordered for readability, not padding
        - shadow           # too many false positives
    revive:
      rules:
        - name: unused-parameter
          disabled: true   # interfaces require full signatures
        - name: exported
          arguments:
            - disableStutteringCheck
            - disableChecksOnConstants
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: unnecessary-stmt
        - name: early-return
    interfacebloat:
      max: 12             # ISP: no interface > 12 methods
    maintidx:
      under: 20           # maintainability index threshold

  exclusions:
    paths:
      # Demonstration code: kept compiling + vet-clean by CI, but not subject to
      # the library's strict style/security gate (examples favour pedagogical
      # clarity over hardening, and are already excluded from the coverage gate).
      - examples
      # Load/soak + profiling harness (loadtest/loadgen): tooling, not library
      # code — same rationale as examples/. Still build- and vet-checked by CI.
      - loadtest
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - dupl           # test code often has legitimate duplication
          - funlen         # table-driven tests are long
          - gocognit
          - gocyclo
          - maintidx
          - goconst
          - gosec          # tests use throwaway TLS configs/listeners and ignore I/O errors
          - gocritic       # test-only style (unlabelled switches, etc.) is not production code
          - exhaustive     # test switches need not enumerate every frame type
          - makezero       # fuzz/test buffers are deliberately pre-sized

# ─── Formatting gate ───
# In golangci-lint v2 the formatters are NOT valid `linters.enable` entries —
# they live in this top-level `formatters:` section, and `golangci-lint run`
# reports an unformatted file as an issue (exit 1) without rewriting it.
# Verified against the pinned v2.3.0 (`golangci-lint formatters`).
#
# Without this block the repo had no automated answer to "is this gofmt-clean":
# `make lint` is `go vet` + `golangci-lint run`, and neither checks formatting,
# so 15 files drifted unformatted while every gate stayed green.
#
# Scope caveat, measured against v2.3.0 rather than assumed: the path list in
# `linters.exclusions.paths` (examples, loadtest) is applied GLOBALLY to every
# issue, formatter issues included — so those two trees are outside this gate.
# Verified by removing `examples` from that list, at which point gofmt/errcheck
# both began reporting examples/tls-server/main.go. Un-excluding them here is not
# possible without also subjecting them to the full strict linter set, which the
# comment above deliberately opted out of. The follow-up style commit still
# gofmt's those trees; they are simply not gated against future drift.
formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
