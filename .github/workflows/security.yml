name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays 06:00 UTC — catches newly disclosed advisories on cadence.
    - cron: '0 6 * * 1'

# Least privilege at the workflow level; individual jobs widen only what they need.
permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          # No allowlist. The previous one carried GO-2026-5856 (crypto/tls ECH
          # privacy leak) because no released toolchain fixed it; go1.26.5 does,
          # this job now pins go1.26.6, and the finding is gone. Re-introducing
          # an allowlist means writing down the OSV id, why it is not exploitable
          # here, and the version that will retire it — not just silencing a red.

          # Machine-readable, symbol-level scan. govulncheck exits non-zero when
          # it finds *called* vulns; tolerate that and make our own decision from
          # the findings below so merely-imported (unreachable) vulns never fail.
          json="$(govulncheck -format json ./... || true)"

          # Reachable (called) OSV ids = findings whose call trace resolves to a
          # symbol (any frame has a function). Imported-only findings have no
          # function in their trace and are ignored. Anything reachable fails the
          # gate.
          reachable="$(printf '%s' "$json" \
            | jq -r 'select((.finding.trace? // []) | any(.function != null)) | .finding.osv' \
            | sort -u | grep -v '^$' || true)"

          echo "reachable vulnerabilities: ${reachable:-<none>}"

          if [ -n "$reachable" ]; then
            echo "::error::govulncheck found reachable vulnerabilities:"
            echo "$reachable"
            govulncheck ./... || true   # human-readable report for the log
            exit 1
          fi
          echo "govulncheck: OK — no reachable vulnerabilities."

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so secret scanning can inspect every commit, not just HEAD.
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: poseidon-http-server.spdx.json
          output-file: poseidon-http-server.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: poseidon-http-server.spdx.json
          if-no-files-found: error
